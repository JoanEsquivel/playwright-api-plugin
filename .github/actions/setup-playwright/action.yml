name: Setup Playwright
description: Install pnpm, Node and dependencies; browsers only when a job asks for them
inputs:
  browsers:
    description: Space-separated browsers to install. Empty (default) for API-only jobs.
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Resolve Playwright version
      if: inputs.browsers != ''
      id: pw
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      if: inputs.browsers != ''
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-${{ inputs.browsers }}
    - name: Install browsers
      if: inputs.browsers != '' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install ${{ inputs.browsers }} --with-deps
    - name: Install system dependencies only
      if: inputs.browsers != '' && steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps ${{ inputs.browsers }}
