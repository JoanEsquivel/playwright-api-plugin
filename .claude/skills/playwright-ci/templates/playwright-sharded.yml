name: Playwright (sharded)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
env:
  CI: true
  API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:8000/api/' }}
  API_USER_EMAIL: ${{ secrets.API_USER_EMAIL }}
  API_USER_PASSWORD: ${{ secrets.API_USER_PASSWORD }}
  API_ADMIN_EMAIL: ${{ secrets.API_ADMIN_EMAIL }}
  API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
  # Playwright's webServer starts the API under test with these.
  API_SERVER_COMMAND: ${{ vars.API_SERVER_COMMAND || 'uv run uvicorn app.main:app --port 8000 --log-level warning' }}
  API_SERVER_CWD: ${{ vars.API_SERVER_CWD || 'app-under-test/backend' }}
  API_SERVER_READY_URL: ${{ vars.API_SERVER_READY_URL || 'http://localhost:8000/api/health' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4
      - name: Check out the API under test
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_SERVER_REPOSITORY || 'JoanEsquivel/the-test-automation-website' }}
          path: app-under-test
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install API dependencies
        working-directory: ${{ env.API_SERVER_CWD }}
        run: uv sync
      - uses: ./.github/actions/setup-playwright
      # Every shard starts its own copy of the API through webServer, so shards never share state.
      - name: Run shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report-sharded
          path: playwright-report/
          retention-days: 14
